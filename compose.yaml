services:

    zookeeper:
        image: confluentinc/cp-zookeeper:latest
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
            ZOOKEEPER_TICK_TIME: 2000
        depends_on:
            - db

    kafka-broker-1:
        container_name: broker_1
        image: confluentinc/cp-kafka:latest
        depends_on:
            - zookeeper
        ports:
            - 19092:19092
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker_1:9092,PLAINTEXT_HOST://localhost:19092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

    kafka-broker-2:
        container_name: broker_2
        image: confluentinc/cp-kafka:latest
        depends_on:
            - zookeeper
        ports:
            - 29092:29092
        environment:
            KAFKA_BROKER_ID: 2
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker_2:9093,PLAINTEXT_HOST://localhost:29092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

    kafka-broker-3:
        container_name: broker_3
        image: confluentinc/cp-kafka:latest
        depends_on:
            - zookeeper
        ports:
            - 39092:39092
        environment:
            KAFKA_BROKER_ID: 3
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker_3:9094,PLAINTEXT_HOST://localhost:39092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    #--------------------------------------------------------------------------------------------------------
    prometheus:
        image: prom/prometheus:latest
        volumes:
            - ./prometheus/:/etc/prometheus/
            - prometheus_data:/prometheus
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.console.libraries=/usr/share/prometheus/console_libraries'
            - '--web.console.templates=/usr/share/prometheus/consoles'
            - '--web.enable-lifecycle'
        ports:
            - 53120:9090
        links:
            - cadvisor:cadvisor
            #- alertmanager:alertmanager
        depends_on:
            - cadvisor
        restart: always
        deploy:
            mode: global

    cadvisor:
        image: gcr.io/cadvisor/cadvisor:v0.47.2
        privileged: true
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - /var/lib/docker/:/var/lib/docker:ro
            - /tmp:/tmp:ro
            - /etc/machine-id:/etc/machine-id:ro

        ports:
            - 8080:8080
        restart: always
        deploy:
            mode: global
    #--------------------------------------------------------------------------------------------------------
    db:
        build:
            context: .
            dockerfile: Dockerfile-mysql
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: hw1
            MYSQL_USER: andrea
            MYSQL_PASSWORD: password
        volumes:
            - hw1_volume:/var/lib/mysql
        container_name: hw1_db_container
        ports:
            - 3306:3306
    create_topics:
        build:
            context: .
            dockerfile: Dockerfile-create-topics
        container_name: hw1_create_topics_container
        depends_on:
            - kafka-broker-1
            - kafka-broker-2
            - kafka-broker-3
        restart: on-failure
        tty: true
    server:
        build:
            context: .
            dockerfile: Dockerfile-server
        ports:
            - 50051:50051
            - 5555:5555
        container_name: hw1_server_container
        depends_on:
            - db
        restart: always
        tty: true

    data_collector:
        build:
            context: .
            dockerfile: Dockerfile-data_collector
        container_name: hw1_data_collector_container
        depends_on:
            - create_topics
        restart: always
        tty: true
        ports:
            - 7777:7777
    alert_notifier_system:
        build:
            context: .
            dockerfile: Dockerfile-alert_notifier_system
        container_name: hw1_alert_notifier_system_container
        depends_on:
            - create_topics
        restart: always
        tty: true
    alert_system:
        build:
            context: .
            dockerfile: Dockerfile-alert_system
        container_name: hw1_alert_system_container
        depends_on:
            - create_topics
        restart: always
        tty: true
volumes:
    hw1_volume:
        driver: local
    prometheus_data: {}
