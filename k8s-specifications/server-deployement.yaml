apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: server
  name: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
      - image: andyaz/server:latest
        name: server
        ports:
        - containerPort: 50051
          name: server
        - containerPort: 5555
          name: server-metrics
      initContainers:
        - name: init-container
          image: busybox
          command: ['sh', '-c', 'until nc -zv db 3306; do echo "Waiting for db..."; sleep 2; done']

