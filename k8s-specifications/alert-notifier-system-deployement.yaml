apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: alert-notifier-system
  name: alert-notifier-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-notifier-system
  template:
    metadata:
      labels:
        app: alert-notifier-system
    spec:
      containers:
      - image: andyaz/alert-notifier-system:latest
        name: alert-notifier-system
      initContainers:
        - name: init-container
          image: busybox
          command: ['sh', '-c', 'until nc -zv create-topics 2222; do echo "Waiting for create-topics..."; sleep 2; done']

